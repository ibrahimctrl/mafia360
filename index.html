<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABUMOUSA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@300;500&display=swap');

body{
    margin:0;
    height:100vh;
    font-family:'Orbitron', sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#fff;
    overflow:hidden;
}

/* 🎥 Video Background */
#bg-video{
    position:fixed;
    right:0;
    bottom:0;
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-2;
}

/* dark overlay */
body::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

.container{
    position:relative;
    z-index:2;
    background: rgba(255,255,255,0.05);
    padding:30px 40px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 30px rgba(255,0,0,0.15);
    animation: fadeIn 1s ease-in-out;
}

.top-image{
    width:160px;
    border-radius:10px;
    margin-bottom:15px;
    border:2px solid rgba(255,0,0,0.4);
}

.small-name{
    font-size:12px;
    letter-spacing:3px;
    opacity:0.7;
    color:#ff3b3b;
    font-weight:300;
    margin-bottom:10px;
}

.glitch{
    font-size:34px;
    font-weight:300;
    letter-spacing:2px;
    color:#ff2b2b;
    margin:10px 0;
}

.subtitle{
    font-size:14px;
    color:#ccc;
    margin-bottom:20px;
}

.ipbox{
    margin-top:15px;
    font-size:13px;
    line-height:1.8;
    background: rgba(0,0,0,0.3);
    padding:15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
}

.ipbox span{
    color:#ff4d4d;
}

.red{
    margin-top:15px;
    color:#ff2b2b;
    font-size:16px;
    letter-spacing:1px;
}

@keyframes fadeIn{
    from{opacity:0; transform:scale(0.95);}
    to{opacity:1; transform:scale(1);}
}
</style>
</head>

<body>

<!-- 🎥 BACKGROUND VIDEO -->
<video autoplay muted loop id="bg-video">
    <source src="video.mp4" type="video/mp4">
</video>

<!-- 🔊 MUSIC -->
<audio autoplay loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <img class="top-image" src="img.jpg">

    <div class="small-name">( ABUMOUSA )</div>

    <div class="glitch">( Hacked By ABUMOUSA )</div>

    <div class="subtitle">الحماية زبالة يا فيصل </div>

    <div class="ipbox">
        IP: <span id="ip">Loading...</span><br>
        City: <span id="city">----</span><br>
        Country: <span id="country">----</span><br>
        ISP: <span id="isp">----</span>
    </div>

    <div class="red">FU**ED BY EURO AND ABUMOUSA</div>

</div>

<script>
fetch("https://ipapi.co/json/")
.then(res => res.json())
.then(data => {
    document.getElementById("ip").innerText = data.ip;
    document.getElementById("city").innerText = data.city;
    document.getElementById("country").innerText = data.country_name;
    document.getElementById("isp").innerText = data.org;
})
.catch(() => {
    document.getElementById("ip").innerText = "Unavailable";
});
</script>

</body>
</html>
